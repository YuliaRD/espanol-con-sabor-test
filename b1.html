function shuffled(n){let arr=Array.from({length:n},(_,i)=>i);let seed=D.level==='B1'?371:923;for(let i=n-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;let j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}const bankOrder=shuffled(D.phrases.length);
function matching(){return '<h2>Relaciona las frases con las escenas</h2><p>'+D.phrases.length+' respuestas. Arrastra una frase hasta la escena. En el móvil, toca primero una frase y después «Colocar aquí» en la escena.</p><div id="selection" class="selected-note" aria-live="polite"></div><div id="bank" class="bank" aria-label="Frases disponibles"></div><div class="scenes">'+D.phrases.map((p,i)=>'<article class="scene" data-scene="'+i+'">'+sceneSVG(p.kind)+'<p><b>'+(i+1)+'.</b> '+esc(p.scene)+'</p><button class="dropbutton" data-place="'+i+'"></button><button class="clear" data-clear="'+i+'">Quitar</button></article>').join('')+'</div>'}
function paintMatches(){const used=new Set(Object.values(state.matches));$('bank').innerHTML=bankOrder.map(i=>'<button type="button" class="phrase '+(selected===i?'selected ':'')+(used.has(i)?'used':'')+'" draggable="true" data-phrase="'+i+'" aria-pressed="'+(selected===i)+'">'+esc(D.phrases[i].phrase)+(used.has(i)?' ✓':'')+'</button>').join('');$('selection').textContent=selected===null?'Elige una frase.':('Seleccionada: '+D.phrases[selected].phrase+' → toca una escena.');document.querySelectorAll('[data-scene]').forEach(el=>{const i=el.dataset.scene;el.classList.toggle('has',state.matches[i]!==undefined);el.querySelector('[data-place]').textContent=state.matches[i]===undefined?'Colocar aquí':D.phrases[state.matches[i]].phrase;el.querySelector('[data-clear]').hidden=state.matches[i]===undefined});resize()}
function assign(target,phrase){if(phrase===null||!Number.isInteger(phrase)||phrase<0||phrase>=D.phrases.length)return;const previous=Object.keys(state.matches).find(k=>state.matches[k]===phrase);const replaced=state.matches[target];if(previous!==undefined){if(replaced!==undefined&&+previous!==+target)state.matches[previous]=replaced;else delete state.matches[previous]}state.matches[target]=phrase;selected=null;paintMatches();update()}
function reading(){return D.readings.map((r,i)=>'<div class="card"><h2>'+r.title+'</h2><div class="passage">'+esc(r.text)+'</div></div>'+r.questions.map((q,j)=>options(q,i*4+j,'reading','R'+(i*4+j+1))).join('')).join('')}
function audio(){return '<h2>Escucha y responde</h2><p class="muted">Escucha cada diálogo y responde a las preguntas. Puedes pausar y volver a escuchar la grabación.</p>'+D.audio.map((a,i)=>'<div class="card"><h3>'+a.title+'</h3><audio controls preload="none" style="width:100%" aria-label="'+esc(a.title)+'" src="'+RECORDINGS[i]+'"></audio></div>'+a.questions.map((q,j)=>options(q,i*4+j,'audio','A'+(i*4+j+1))).join('')).join('')}
function stopAudio(){document.querySelectorAll('audio').forEach(a=>a.pause())}
function playAudio(i){const player=document.querySelectorAll('audio')[i];if(player)player.play().catch(()=>{})}
function norm(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}
function accepts(value,answer){const variants=[answer];if(answer.includes('iera'))variants.push(answer.replace('iera','iese'));if(answer.includes('iéramos'))variants.push(answer.replace('iéramos','iésemos'));return variants.some(a=>norm(a)===norm(value))}
function evaluate(){const rows=[];D.grammar.keys.forEach((key,i)=>rows.push({group:0,label:'G'+(i+1),prompt:i<8?'Tabla de conjugación':D.grammar.title,answer:key,got:state.grammar[i]||'—',ok:accepts(state.grammar[i],key)}));D.choice.forEach((q,i)=>rows.push({group:0,label:'G'+(i+15),prompt:q.prompt,answer:q.options[q.correct],got:q.options[state.choices[i]]||'—',ok:state.choices[i]===q.correct}));D.phrases.forEach((p,i)=>rows.push({group:1,label:'V'+(i+1),prompt:p.scene,answer:p.phrase,got:D.phrases[state.matches[i]]?.phrase||'—',ok:state.matches[i]===i}));for(const [section,group,bucket] of [['readings',2,'reading'],['audio',3,'audio']])D[section].forEach((item,i)=>item.questions.forEach((q,j)=>rows.push({group,label:(group===2?'R':'A')+(i*4+j+1),prompt:q.prompt,answer:q.options[q.correct],got:q.options[state[bucket][i*4+j]]||'—',ok:state[bucket][i*4+j]===q.correct})));return rows}
function results(){return '<div class="card"><h2>Resultados · '+D.level+'</h2><p>Когда ответишь на все вопросы, заверши уровень.</p><button class="primary" id="check">Завершить B1</button><div id="result"></div></div>'}
function grade(){const answered=filled();if(answered<totalAnswers){parent.postMessage({kind:'sabor-incomplete',level:D.level.toLowerCase(),answered,total:totalAnswers},'*');return}const rows=evaluate();parent.postMessage({kind:'sabor-result',level:D.level.toLowerCase(),scores:[0,1,2,3].map(i=>rows.filter(r=>r.group===i&&r.ok).length),totals,answered},'*')}
function render(){
  $('content').innerHTML=[grammar,matching,reading,audio,results].map(section=>'<section class="test-section">'+section()+'</section>').join('');
  paintMatches();
  update();
}
document.addEventListener('input',e=>{if(e.target.matches('[data-input]')){state.grammar[e.target.dataset.input]=e.target.value;update()}});document.addEventListener('change',e=>{if(e.target.matches('[data-group]')){state[e.target.dataset.group][e.target.dataset.id]=+e.target.value;update()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-phrase')){selected=+b.dataset.phrase;paintMatches()}else if(b.hasAttribute('data-place'))assign(+b.dataset.place,selected);else if(b.hasAttribute('data-clear')){delete state.matches[b.dataset.clear];paintMatches();update()}else if(b.hasAttribute('data-play'))playAudio(+b.dataset.play);else if(b.hasAttribute('data-stop'))stopAudio();else if(b.id==='check')grade();});
document.addEventListener('dragstart',e=>{const b=e.target.closest('[data-phrase]');if(!b)return;selected=+b.dataset.phrase;e.dataTransfer.setData('text/plain',b.dataset.phrase);e.dataTransfer.effectAllowed='move'});document.addEventListener('dragover',e=>{const target=e.target.closest('[data-scene]');if(target){e.preventDefault();target.classList.add('over')}});document.addEventListener('dragleave',e=>{const target=e.target.closest('[data-scene]');if(target&&!target.contains(e.relatedTarget))target.classList.remove('over')});document.addEventListener('drop',e=>{const target=e.target.closest('[data-scene]');if(!target)return;e.preventDefault();target.classList.remove('over');const raw=e.dataTransfer.getData('text/plain');if(!/^\d+$/.test(raw))return;assign(+target.dataset.scene,+raw)});render();new ResizeObserver(resize).observe(document.body);window.addEventListener('pagehide',stopAudio);
</script><script>(function(){function pause(){document.querySelectorAll('audio').forEach(a=>a.pause())}document.addEventListener('play',e=>{if(e.target.tagName!=='AUDIO')return;document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()});parent.postMessage({kind:'sabor-audio-start',level:'b1'},'*')},true);document.addEventListener('click',e=>{if(e.target.closest('.nav button,.tabs button,#prev,#next,#check'))pause()});window.addEventListener('message',e=>{if(e.source===parent&&e.data?.kind==='sabor-pause-audio')pause()});window.addEventListener('pagehide',pause)})();</script><script>(function(){let lastHeight=0;function fit(){const h=Math.ceil(document.body.getBoundingClientRect().height)+12;if(h!==lastHeight){lastHeight=h;parent.postMessage({kind:'sabor-size',level:'b1',height:h},'*')}}new ResizeObserver(fit).observe(document.body);window.addEventListener('load',fit);document.addEventListener('click',()=>requestAnimationFrame(fit));})();</script></body></html>
